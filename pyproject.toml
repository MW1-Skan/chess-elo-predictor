[project]
name = "chess-elo-predictor"
version = "0.1.0"
description = "Predict Lichess game outcome and average player rating from completed-game features."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",        # parquet engine for processed data
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",          # FastAPI TestClient
    "matplotlib>=3.9",      # EDA only
    "jupyter>=1.1",         # EDA notebook
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
